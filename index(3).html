<title>حساباتي</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: ledger sidebar on the right + white working sheets on a faint green-grey desk */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface2:#f7faf9; --ink:#13201b; --muted:#5b6a64; --line:#e0e7e4;
  --accent:#0c6a53; --accent-ink:#ffffff; --accent-weak:#e1f0ea;
  --good:#13753a; --good-weak:#e5f4ea; --warn:#9a5306; --warn-weak:#fcf1e1; --bad:#b32222; --bad-weak:#fcebeb; --eng:#b2bdb8; --eng-hi:#ffffff; --eng-lo:rgba(0,0,0,.22); --paper:#f6f8f7; --logo-page:#ffffff; --logo-spine:#0c6a53; --logo-line:#9fc4b7; --logo-mark:#d9822b;
  --f-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface2:#1a2420; --ink:#e5ece9; --muted:#93a39c; --line:#26332e;
  --accent:#41c29b; --accent-ink:#06261d; --accent-weak:#163029;
  --good:#5dd38a; --good-weak:#14301f; --warn:#f0a743; --warn-weak:#33250f; --bad:#f27b7b; --bad-weak:#3a1717; --eng:#24302c; --eng-hi:rgba(255,255,255,.09); --eng-lo:#000000; --paper:#121a17; --logo-page:#e8f1ed; --logo-spine:#41c29b; --logo-line:#7aa597; --logo-mark:#f0a743; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface2:#1a2420; --ink:#e5ece9; --muted:#93a39c; --line:#26332e;
  --accent:#41c29b; --accent-ink:#06261d; --accent-weak:#163029;
  --good:#5dd38a; --good-weak:#14301f; --warn:#f0a743; --warn-weak:#33250f; --bad:#f27b7b; --bad-weak:#3a1717; --eng:#24302c; --eng-hi:rgba(255,255,255,.09); --eng-lo:#000000; --paper:#121a17; --logo-page:#e8f1ed; --logo-spine:#41c29b; --logo-line:#7aa597; --logo-mark:#f0a743; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:24px} h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px} p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
.m{unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}
.mt{margin-top:18px}.mt-s{margin-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{min-height:calc(100vh - 32px);display:grid;place-items:center}
.lcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--accent-weak);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.2}
.credit{border-top:1px dashed var(--line);padding-top:10px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:10.5px;color:var(--muted)}
.credit .who{display:grid;line-height:1.25;text-align:start}
.credit b{color:var(--muted);font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.4px;direction:ltr;text-align:start}
.cp{font-family:Georgia,'Times New Roman',serif;font-weight:700;line-height:1;color:var(--eng);text-shadow:0 1px 0 var(--eng-hi),0 -1px 0 var(--eng-lo);
  background:var(--paper);border-radius:50%;box-shadow:inset 0 1px 2px var(--eng-lo),0 1px 0 var(--eng-hi);display:inline-grid;place-items:center;user-select:none}
.credit .cp{font-size:15px;width:24px;height:24px}
.credit .ct{font-size:10.5px;direction:rtl;margin-top:1px}
.credit .ct{display:flex;align-items:center;gap:5px}
.credit .wa{color:var(--good);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--good-weak)}
.credit .wa:hover{color:var(--surface);background:var(--good)}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.hint{background:var(--accent-weak);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:13px}

/* app shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start}
aside{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
.grp{display:grid;gap:2px}
.glabel{font-size:11.5px;color:var(--muted);letter-spacing:.4px;padding:0 12px 4px;font-weight:600}
.nav{display:grid;gap:12px}
.nav button{display:block;width:100%;text-align:start;padding:8px 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.me b{display:block;font-size:14px}
.dev{font-size:10.5px;color:var(--muted);direction:ltr;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.3px}
.dev .cp{font-size:13px;width:20px;height:20px}
main{min-width:0;padding-bottom:40px}
@media (max-width:860px){
  .app{display:block}
  aside{position:static;max-height:none;margin-bottom:16px;padding:12px}
  .nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:2px}
  .grp{display:contents}.glabel{display:none}
  .nav button{white-space:nowrap;width:auto;background:var(--surface2)}
  .dev{display:none}
}

/* building blocks */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-family:var(--f-display);font-size:21px;font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.big{padding:11px 22px;font-size:16px}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.dan{color:var(--bad)} .btn.dan:hover{border-color:var(--bad)}
.btn.solid.dan{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-weak)}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters .in{width:auto} .filters .grow{flex:1 1 200px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-weak);color:var(--good)}
.pill.wa{background:var(--warn-weak);color:var(--warn)}
.pill.ba{background:var(--bad-weak);color:var(--bad)}
.pill.nu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pos-v{color:var(--bad)} .neg-v{color:var(--good)}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.banner{background:var(--warn-weak);color:var(--warn);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:14px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line);border-bottom:0}
td .acts{flex-wrap:nowrap;gap:4px}
.ser{color:var(--muted);font-size:13px}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px;font-size:13px;color:var(--muted)}

/* chart */
.bars{display:flex;align-items:stretch;gap:8px;height:190px}
.bar{flex:1;display:grid;grid-template-rows:auto 1fr auto;gap:4px;text-align:center;min-width:0}
.bar b{font-size:11px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.track i{display:block;width:100%;max-width:40px;background:var(--accent-weak);border:1px solid var(--accent);border-bottom:0;border-radius:6px 6px 0 0;min-height:2px}
.bar.now .track i{background:var(--accent)}
.bar span{font-size:12px;color:var(--muted)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:1050px){.pos{grid-template-columns:1fr}}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:62vh;overflow:auto;align-content:start}
.pbtn{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px;cursor:pointer;display:grid;gap:2px;font-size:14px}
.pbtn:hover{border-color:var(--accent);background:var(--accent-weak)}
.pbtn small{color:var(--muted);font-size:12px}
.lowt{color:var(--bad)!important}
.qi{width:76px;padding:5px 8px}.qi.w{width:96px}
.tot{display:grid;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tot>div{display:flex;justify-content:space-between;gap:12px}
.tot .grand{font-family:var(--f-display);font-size:20px;font-weight:700;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px}
.tot .rem{color:var(--bad);font-weight:600}
.tot .mut{color:var(--muted);font-size:13.5px}

/* P&L */
.pl{display:grid}
.pl>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl .sum{font-weight:700;font-family:var(--f-display)}
.pl .net{font-size:19px;border-bottom:0;border-top:2px solid var(--ink);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(8,18,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.sheet{background:var(--surface);border-radius:14px;width:min(680px,100%);padding:20px;margin-block:5vh;box-shadow:0 24px 60px rgba(0,0,0,.25);min-width:0}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.end{text-align:end}
/* license lock */
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lock .lcard{text-align:center;justify-items:center}
.lock h2{font-size:20px;justify-content:center}
.devid{font-family:ui-monospace,monospace;font-size:18px;letter-spacing:2px;background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:8px 14px;direction:ltr;user-select:all}
.lic{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.lic div{display:grid;gap:2px}.lic span{font-size:12.5px;color:var(--muted)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:var(--surface)}
#toast.ok{background:var(--good);color:var(--surface)}
/* printable documents (fixed paper colors on purpose) */
#printArea{display:none}
#pdfStage{position:fixed;top:0;left:-14000px;background:#fff;z-index:-1}
.doc{background:#fff;color:#111;direction:rtl;font-family:var(--f-body);line-height:1.45}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc .c{text-align:center}.doc .end{text-align:end}
.doc .kv{display:flex;justify-content:space-between;gap:8px}
.doc .hr{border-top:1px dashed #111;margin:5px 0}
.doc .grand{font-size:1.25em;font-weight:700;border-top:1px solid #111;border-bottom:1px solid #111;padding:3px 0;margin:3px 0}
.doc .cr{font-size:.78em;color:#666;margin-top:6px;direction:ltr}
.doc.roll{width:72mm;font-size:12px;padding:2mm 1mm}
.doc.r58{width:50mm;font-size:10.5px}
.doc.roll .bn{font-size:1.35em;font-family:var(--f-display);display:block}
.doc.roll th,.doc.roll td{padding:2px 1px;text-align:start;border:0;white-space:normal;background:none;color:#111;font-size:.95em}
.doc.roll th{border-bottom:1px solid #111;font-weight:700}
.doc.page{width:186mm;font-size:13px;padding:2mm}
.doc.a5{width:128mm;font-size:11px}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #0c6a53;padding-bottom:10px;margin-bottom:12px}
.doc .dh h1{font-size:1.6em;color:#0c6a53;font-family:var(--f-display)}
.doc .tt{font-size:1.35em;font-weight:700;font-family:var(--f-display)}
.doc .box{border:1px solid #cfd8d4;border-radius:6px;padding:8px 10px}
.doc.page th{background:#eef5f2;color:#111;border:1px solid #cfd8d4;padding:6px 8px;text-align:start;font-size:.92em;white-space:nowrap}
.doc.page td{border:1px solid #cfd8d4;padding:5px 8px;white-space:normal;background:none;color:#111}
.doc.page tfoot td{font-weight:700;background:#f4f7f6}
.doc .tots{width:48%;margin-inline-start:auto;margin-top:10px}
.doc .tots .kv{padding:3px 0;border-bottom:1px solid #e6e6e6}
.doc .sec{margin-top:14px}.doc .sec h3{font-size:1.1em;margin-bottom:6px;color:#0c6a53}
.doc .sig{display:flex;justify-content:space-between;margin-top:40px}
.doc .sig div{border-top:1px solid #111;width:38%;text-align:center;padding-top:4px}
.doc .foot{margin-top:18px;text-align:center;color:#555;font-size:.9em}
@media print{
  html,body{background:#fff!important}
  body{padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.tool .f{min-width:150px}
.scroll{max-height:42vh;overflow:auto}
textarea.in{min-height:140px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
</style>

</head>

<script>
const $=s=>document.querySelector(s);
const KEY='hesabaty_db_v1',SKEY='hesabaty_session';
/* المستخدم الافتراضي لأول تشغيل — غيّر القيمتين دول لو عاوز افتراضي تاني */
const DEFAULT_USER='ahmed',DEFAULT_PASS='112233Aa';
/* ربط لوحة تحكم المطور (Firebase). سيبهم فاضيين = البرنامج شغال من غير ترخيص */
const LIC_CFG={apiKey:'',projectId:'',trialDays:14};
const APP_VER='1.6',DEV_PHONE='01092947546',DEV_WA='201092947546';
let DB,ME=null,VIEW='dash',CART=null,PEND=null;
const ROLES={admin:'مدير',accountant:'محاسب',cashier:'كاشير'};
const KIND={sale:'مبيعات',purchase:'مشتريات',receipt:'تحصيل من عميل',payment:'سداد لمورد',expense:'مصروف',deposit:'إيداع',withdraw:'سحب'};
const UNITS=['قطعة','كجم','جرام','لتر','علبة','كيس','كرتونة','زجاجة','متر','خدمة'];
const EXCATS=['إيجار','كهرباء','مياه','مرتبات','نقل وشحن','صيانة','إنترنت وتليفون','ضرائب ورسوم','أخرى'];

/* ---------- helpers ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function h(s){let x=5381;for(const c of String(s))x=((x<<5)+x+c.charCodeAt(0))|0;return 'h'+(x>>>0).toString(36)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',','.'));return isFinite(n)?n:0}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100}
function nfmt(n){return r2(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function money(n){return `<span class="m">${r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} ${esc(DB.settings.currency)}</span>`}
function dstr(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function today(){return dstr(new Date())}
function nowTime(){return new Date().toTimeString().slice(0,5)}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return dstr(d)}
function monthStart(off=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return dstr(d)}
function monthEnd(off=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off+1);d.setDate(0);return dstr(d)}
function wd(d){return new Date(d+'T00:00').toLocaleDateString('ar-EG',{weekday:'short'})}
function longDate(d){return new Date(d+'T00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function sum(a,f){return r2(a.reduce((s,x)=>s+(typeof f==='function'?f(x):num(x[f])),0))}
function between(d,a,b){return (!a||d>=a)&&(!b||d<=b)}
function byDateDesc(a,b){return (b.date+(b.time||'')).localeCompare(a.date+(a.time||''))}
function prod(id){return DB.products.find(p=>p.id===id)}
function party(pt,id){return (pt==='c'?DB.customers:DB.suppliers).find(x=>x.id===id)}
function partyName(pt,id){const p=id&&party(pt,id);return p?p.name:(pt==='c'?'عميل نقدي':'مورد نقدي')}
function calc(items,disc,taxPct){const sub=sum(items,i=>num(i.qty)*num(i.price));const d=Math.min(Math.max(0,num(disc)),sub);const tax=r2((sub-d)*num(taxPct)/100);return {sub,disc:r2(d),tax,total:r2(sub-d+tax)}}
function invCost(i){return sum(i.items,x=>num(x.qty)*num(x.cost))}
function invNet(i){return r2(i.sub-i.disc)}
function profitOf(list){return sum(list,i=>invNet(i)-invCost(i))}
function toast(msg,kind=''){const t=$('#toast');t.textContent=msg;t.className=kind;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}

/* ---------- storage ---------- */
function base(){return {settings:{name:'',phone:'',address:'',currency:'ج.م',tax:0,openingCash:0,allowNeg:false,invNo:1,purNo:1,paper:'r80',footer:'شكراً لتعاملكم معنا',autoPrint:false},
  users:[{id:uid(),name:'المدير',user:DEFAULT_USER,pass:h(DEFAULT_PASS),role:'admin'}],products:[],customers:[],suppliers:[],invoices:[],cash:[],expenses:[],stockLog:[],sample:false}}
function load(){try{const s=localStorage.getItem(KEY);if(s){DB=JSON.parse(s);migrate();return}}catch(e){}
  DB=base();addSample();save()}
function migrate(){const d=base();for(const k in d)if(DB[k]===undefined)DB[k]=d[k];for(const k in d.settings)if(DB.settings[k]===undefined)DB.settings[k]=d.settings[k];if(!DB.users.length)DB.users=d.users;if(DB.settings.name==='محلي')DB.settings.name='';
  const old=DB.users.find(u=>u.user==='admin'&&u.pass===h('1234'));if(old&&!DB.users.some(u=>u.user===DEFAULT_USER)){old.user=DEFAULT_USER;old.pass=h(DEFAULT_PASS)}}
function save(){clearTimeout(save.t);save.t=setTimeout(autoBackup,1200);try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('تعذر الحفظ في المتصفح — خد نسخة احتياطية من الإعدادات','bad')}}

/* ---------- core accounting ---------- */
function postInvoice(inv){
  const t=calc(inv.items,inv.disc,inv.taxPct),sale=inv.type==='sale';
  const no=sale?DB.settings.invNo++:DB.settings.purNo++;
  const rec={id:uid(),no,type:inv.type,date:inv.date,time:inv.time,partyId:inv.partyId||null,items:inv.items.map(i=>({...i})),
    disc:t.disc,taxPct:num(inv.taxPct),sub:t.sub,tax:t.tax,total:t.total,paid:r2(Math.min(num(inv.paid),t.total)),note:inv.note||'',user:ME?ME.name:'النظام'};
  rec.items.forEach(it=>{const p=prod(it.pid);if(!p)return;
    if(sale){it.cost=num(p.cost);p.qty=r2(num(p.qty)-num(it.qty))}else{it.cost=num(it.price);p.qty=r2(num(p.qty)+num(it.qty));p.cost=num(it.price)}});
  DB.invoices.push(rec);
  if(rec.paid>0)DB.cash.push({id:uid(),date:rec.date,time:rec.time,dir:sale?'in':'out',kind:inv.type,partyType:sale?'c':'s',partyId:rec.partyId,amount:rec.paid,ref:rec.id,note:(sale?'مدفوع من فاتورة بيع #':'مدفوع في فاتورة شراء #')+no,user:rec.user});
  return rec}
function addCash(o){DB.cash.push({id:uid(),time:nowTime(),user:ME?ME.name:'النظام',partyType:null,partyId:null,ref:null,note:'',...o})}
function addExpenseCore(date,cat,amount,note){const e={id:uid(),date,cat,amount:r2(amount),note,user:ME?ME.name:'النظام'};DB.expenses.push(e);addCash({date,dir:'out',kind:'expense',amount:e.amount,ref:e.id,note:cat+(note?' — '+note:'')});return e}
function partyBal(pt,id){const P=party(pt,id);let b=P?num(P.opening):0;const t=pt==='c'?'sale':'purchase';
  DB.invoices.forEach(i=>{if(i.type===t&&i.partyId===id)b+=i.total});
  DB.cash.forEach(c=>{if(c.partyType===pt&&c.partyId===id){if(pt==='c')b+=c.dir==='in'?-c.amount:c.amount;else b+=c.dir==='out'?-c.amount:c.amount}});
  return r2(b)}
function cashBal(){let b=num(DB.settings.openingCash);DB.cash.forEach(c=>b+=c.dir==='in'?c.amount:-c.amount);return r2(b)}

function addSample(){
  const P=[['سكر أبيض ١ كجم','1001','بقالة','كيس',32,36,120,20],['أرز مصري ١ كجم','1002','بقالة','كيس',28,33,90,20],['زيت عباد الشمس ١ لتر','1003','زيوت','زجاجة',72,82,40,10],['شاي ناعم ٢٥٠ جم','1004','مشروبات','علبة',45,55,35,10],['مكرونة ٤٠٠ جم','1005','بقالة','كيس',13,16,150,30],['صابون غسيل','1006','منظفات','قطعة',18,24,8,10],['جبنة بيضاء','1007','ألبان','كجم',110,130,15,5]];
  DB.products=P.map(a=>({id:uid(),name:a[0],code:a[1],cat:a[2],unit:a[3],cost:a[4],price:a[5],qty:a[6],min:a[7]}));
  DB.customers=[{id:uid(),name:'محمد عبد الله',phone:'01001234567',opening:0},{id:uid(),name:'سوبر ماركت النور',phone:'01112223334',opening:350},{id:uid(),name:'أحمد سعيد',phone:'',opening:0}];
  DB.suppliers=[{id:uid(),name:'شركة الأمل للتوريدات',phone:'0403334455',opening:0},{id:uid(),name:'مخازن الدلتا',phone:'',opening:1200}];
  DB.settings.openingCash=5000;
  const pr=DB.products,cu=DB.customers,ln=(k,q,pr2)=>({pid:pr[k].id,name:pr[k].name,unit:pr[k].unit,qty:q,price:pr2??pr[k].price});
  postInvoice({type:'purchase',date:daysAgo(9),time:'10:00',partyId:DB.suppliers[0].id,items:[ln(0,50,32),ln(4,60,13)],disc:0,taxPct:0,paid:1500});
  [[6,null,[[0,3],[4,5]]],[5,cu[0].id,[[2,2],[3,1]],100],[4,null,[[1,4],[6,1]]],[3,cu[1].id,[[0,10],[4,20]],200],[2,null,[[3,2],[5,3]]],[1,null,[[2,1],[0,2],[4,4]]],[1,cu[2].id,[[6,2]],0],[0,null,[[1,3],[4,6]]]]
   .forEach(([d,pid,its,paid],k)=>{const items=its.map(([a,q])=>ln(a,q));const t=calc(items,0,0);postInvoice({type:'sale',date:daysAgo(d),time:(11+k)+':15',partyId:pid,items,disc:0,taxPct:0,paid:pid?paid:t.total})});
  addExpenseCore(daysAgo(3),'إيجار',1500,'إيجار المحل');addExpenseCore(daysAgo(1),'كهرباء',320,'');
  addCash({date:daysAgo(1),dir:'in',kind:'receipt',partyType:'c',partyId:cu[0].id,amount:150,note:'دفعة تحت الحساب'});
  DB.sample=true}
function clearSample(){Object.assign(DB,{products:[],customers:[],suppliers:[],invoices:[],cash:[],expenses:[],stockLog:[],sample:false});Object.assign(DB.settings,{invNo:1,purNo:1,openingCash:0});save();CART=null;render();toast('اتمسحت البيانات التجريبية — ابدأ ببياناتك','ok')}

/* ---------- auth & shell ---------- */
function canView(v){if(!ME)return false;if(ME.role==='admin')return true;if(ME.role==='accountant')return v!=='settings';return ['pos','invoices','customers'].includes(v)}
const NAV=[{g:'عام',items:[['dash','لوحة التحكم']]},{g:'البيع والشراء',items:[['pos','نقطة البيع'],['purchase','فاتورة شراء'],['invoices','سجل الفواتير']]},
  {g:'الحسابات',items:[['customers','العملاء'],['suppliers','الموردين'],['expenses','المصروفات'],['cash','الخزينة']]},
  {g:'المخزون والتقارير',items:[['products','الأصناف والمخزون'],['reports','التقارير']]},{g:'النظام',items:[['settings','الإعدادات']]}];
function doLogin(e){e.preventDefault();regrant();const u=$('#lu').value.trim(),p=$('#lp').value;const x=DB.users.find(z=>z.user===u&&z.pass===h(p));
  if(!x){$('#lerr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}
  ME=x;$('#lerr').textContent='';$('#lp').value='';try{localStorage.setItem(SKEY,x.id)}catch(e){}VIEW=canView('dash')?'dash':'pos';render()}
function logout(){ME=null;CART=null;try{localStorage.removeItem(SKEY)}catch(e){}render()}
function go(v){VIEW=v;render();window.scrollTo(0,0)}
function render(){
  $('#lbiz').textContent=DB.settings.name||'برنامج الحسابات والمخزون';$('#sbiz').textContent=DB.settings.name;$('#sbiz').hidden=!DB.settings.name;
  if(!ME){$('#app').hidden=true;$('#login').hidden=false;return}
  $('#login').hidden=true;$('#app').hidden=false;
  if(!canView(VIEW))VIEW=canView('dash')?'dash':'pos';
  $('#nav').innerHTML=NAV.map(g=>{const it=g.items.filter(([v])=>canView(v));return it.length?`<div class="grp"><div class="glabel">${g.g}</div>${it.map(([v,l])=>`<button class="${v===VIEW?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}</div>`:''}).join('');
  $('#mebox').innerHTML=`<div><b>${esc(ME.name)}</b><span class="sub">${ROLES[ME.role]}</span></div><button class="btn sm" onclick="logout()">خروج</button>`;
  const V={dash:vDash,pos:()=>vPOS('sale'),purchase:()=>vPOS('purchase'),invoices:vInvoices,products:vProducts,customers:vParties,suppliers:vParties,expenses:vExpenses,cash:vCash,reports:vReports,settings:vSettings};
  $('#main').innerHTML=V[VIEW]();
  const A={pos:()=>{renderPick();renderCart()},purchase:()=>{renderPick();renderCart()},invoices:renderIV,products:renderProd,customers:renderParties,suppliers:renderParties};
  A[VIEW]&&A[VIEW]()}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;const f=$('#sheet input:not([type=hidden]),#sheet select');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML=''}
function confirmBox(msg,fn,label='تأكيد'){PEND=fn;openModal(`<h2>تأكيد</h2><p>${esc(msg)}</p><div class="acts mt"><button class="btn solid dan" onclick="const f=PEND;PEND=null;closeModal();f&&f()">${label}</button><button class="btn" onclick="closeModal()">رجوع</button></div>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function kpi(l,v,s,cls=''){return `<div class="kpi ${cls}"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></div>`}
function stPill(i){const rem=r2(i.total-i.paid);return rem<=0?'<span class="pill ok">مدفوعة</span>':i.paid>0?'<span class="pill wa">جزئي</span>':'<span class="pill ba">آجل</span>'}
function invTable(list,showType){if(!list.length)return '<p class="empty">مفيش فواتير.</p>';
  return `<div class="tw"><table><thead><tr><th>رقم</th>${showType?'<th>النوع</th>':''}<th>التاريخ</th><th>الطرف</th><th>الإجمالي</th><th>المدفوع</th><th>الباقي</th><th>الحالة</th><th></th></tr></thead><tbody>${
  list.map(i=>`<tr><td class="m">#${i.no}</td>${showType?`<td>${i.type==='sale'?'بيع':'شراء'}</td>`:''}<td class="m">${i.date}</td><td>${esc(partyName(i.type==='sale'?'c':'s',i.partyId))}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${money(i.total-i.paid)}</td><td>${stPill(i)}</td><td><button class="btn sm" onclick="viewInv('${i.id}')">عرض</button></td></tr>`).join('')}</tbody></table></div>`}

/* ---------- dashboard ---------- */
function vDash(){
  const t=today(),ms=monthStart(),S=DB.invoices.filter(i=>i.type==='sale');
  const tS=S.filter(i=>i.date===t),mS=S.filter(i=>between(i.date,ms,t));
  const net=r2(profitOf(mS)-sum(DB.expenses.filter(e=>between(e.date,ms,t)),'amount'));
  const recv=sum(DB.customers,c=>Math.max(0,partyBal('c',c.id))),pay=sum(DB.suppliers,s=>Math.max(0,partyBal('s',s.id)));
  const low=DB.products.filter(p=>num(p.qty)<=num(p.min));
  const days=[...Array(7)].map((_,k)=>{const d=daysAgo(6-k);return {d,v:sum(S.filter(i=>i.date===d),'total')}});
  const mx=Math.max(1,...days.map(x=>x.v));
  return `${DB.sample&&ME.role==='admin'?`<div class="banner"><span>البرنامج شغال دلوقتي على <b>بيانات تجريبية</b> علشان تشوف شكله. لما تخلص تجربة امسحها وابدأ ببياناتك.</span><button class="btn sm" onclick="confirmBox('هيتم مسح كل الأصناف والفواتير والعملاء التجريبية. المستخدمين والإعدادات هيفضلوا.',clearSample,'امسح التجريبي')">امسح البيانات التجريبية</button></div>`:''}
${licBanner()}
  <div class="ph"><div><h1>لوحة التحكم</h1><p class="sub">${longDate(t)}</p></div>
   <div class="acts"><button class="btn pri" onclick="go('pos')">فاتورة بيع جديدة</button>${canView('purchase')?`<button class="btn" onclick="go('purchase')">فاتورة شراء</button><button class="btn" onclick="go('expenses')">تسجيل مصروف</button>`:''}</div></div>
  <div class="kpis">${kpi('مبيعات اليوم',money(sum(tS,'total')),tS.length+' فاتورة')}${kpi('مبيعات الشهر',money(sum(mS,'total')),mS.length+' فاتورة')}${kpi('صافي ربح الشهر',money(net),'بعد خصم التكلفة والمصروفات',net<0?'bad':'good')}${kpi('رصيد الخزينة',money(cashBal()),'نقدية متاحة الآن')}${kpi('مستحق على العملاء',money(recv),'مبيعات آجلة')}${kpi('مستحق للموردين',money(pay),'مشتريات آجلة')}</div>
  <div class="grid2 mt">
   <section class="card"><h2>مبيعات آخر ٧ أيام</h2><div class="bars">${days.map(x=>`<div class="bar${x.d===t?' now':''}"><b>${x.v?nfmt(x.v):'—'}</b><div class="track"><i style="height:${Math.max(1,Math.round(x.v/mx*100))}%"></i></div><span>${wd(x.d)}</span></div>`).join('')}</div></section>
   <section class="card"><h2>أصناف قربت تخلص ${low.length?`<span class="pill ba">${low.length}</span>`:''}</h2>${low.length?`<ul class="list">${low.slice(0,7).map(p=>`<li><span>${esc(p.name)}</span><span class="pill ${num(p.qty)<=0?'ba':'wa'}">${nfmt(p.qty)} ${esc(p.unit)} · الحد ${nfmt(p.min)}</span></li>`).join('')}</ul>`:'<p class="empty">كل الأصناف رصيدها فوق حد الطلب.</p>'}</section>
  </div>
  <section class="card mt"><h2>آخر الفواتير</h2>${invTable([...DB.invoices].sort(byDateDesc).slice(0,6),true)}</section>`}

/* ---------- POS / purchase ---------- */
function newCart(type){CART={type,items:[],partyId:'',disc:0,taxPct:type==='sale'?num(DB.settings.tax):0,paid:'',note:'',date:today()}}
function vPOS(type){if(!CART||CART.type!==type)newCart(type);const sale=type==='sale';
  return `<div class="ph"><div><h1>${sale?'نقطة البيع':'فاتورة شراء'}</h1><p class="sub">${sale?'اختار الأصناف أو امسح الباركود واضغط Enter':'سجّل البضاعة الواردة يدوي أو استورد بيان المورد من إكسل / PDF'}</p></div><div class="acts">${sale?'':`<label class="btn pri">استيراد إكسل / PDF<input type="file" id="impf" hidden accept=".xlsx,.xls,.csv,.pdf" onchange="importSheet(this)"></label><button class="btn" onclick="xlsTemplate()">نموذج إكسل فاضي</button>`}${canView('products')?`<button class="btn" onclick="editProduct()">صنف جديد</button>`:''}</div></div>
  <div class="pos"><section class="card"><input id="posq" class="in" placeholder="ابحث بالاسم أو الكود / الباركود" oninput="renderPick()" onkeydown="posKey(event)" autocomplete="off"><div id="plist" class="plist mt-s"></div></section><section class="card" id="cart"></section></div>`}
function renderPick(){const el=$('#plist');if(!el)return;const q=($('#posq').value||'').trim().toLowerCase(),sale=CART.type==='sale';
  const L=DB.products.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.code||'').toLowerCase().includes(q)).slice(0,80);
  el.innerHTML=L.length?L.map(p=>`<button class="pbtn" onclick="addItem('${p.id}')"><b>${esc(p.name)}</b>${money(sale?p.price:p.cost)}<small class="${num(p.qty)<=num(p.min)?'lowt':''}">الرصيد: ${nfmt(p.qty)} ${esc(p.unit)}</small></button>`).join('')

function updTot(){const el=$('#ctot');if(!el)return;const c=CART,t=calc(c.items,c.disc,c.taxPct),paid=c.paid===''?t.total:num(c.paid),rem=r2(t.total-paid),pt=c.type==='sale'?'c':'s';

function reportData(){const inR=d=>between(d,RP.from,RP.to),S=DB.invoices.filter(i=>i.type==='sale'&&inR(i.date)),Pu=DB.invoices.filter(i=>i.type==='purchase'&&inR(i.date)),E=DB.expenses.filter(e=>inR(e.date));
  const rev=sum(S,invNet),cogs=sum(S,invCost),exT=sum(E,'amount'),tp={},bc={};
  S.forEach(i=>{const f=i.sub?(1-i.disc/i.sub):1;i.items.forEach(x=>{const o=tp[x.pid]||(tp[x.pid]={name:x.name,qty:0,rev:0,pr:0});const l=num(x.qty)*num(x.price)*f;o.qty+=num(x.qty);o.rev+=l;o.pr+=l-num(x.qty)*num(x.cost)})});
  E.forEach(e=>bc[e.cat]=(bc[e.cat]||0)+e.amount);
  return {S,Pu,E,rev,cogs,gross:r2(rev-cogs),exT,net:r2(rev-cogs-exT),tax:sum(S,'tax'),pur:sum(Pu,'total'),top:Object.values(tp).sort((a,b)=>b.rev-a.rev),bc:Object.entries(bc).sort((a,b)=>b[1]-a[1]),

function docPDF(html,size,fname,meta){frameNote();return saveAs(fname+'.pdf',T_PDF,()=>buildPDF(html,size,fname,meta),'اتحفظ ملف PDF')}
async function buildPDF(html,size,fname,meta){toast('جاري تجهيز ملف PDF...');
  try{await needAll('h2c','jspdf')}catch(e){toast('أول مرة تعمل PDF محتاج إنترنت علشان يحمّل المكتبة','bad');return null}
  const st=$('#pdfStage');st.innerHTML=html;try{await document.fonts.ready}catch(e){}
  try{const canvas=await html2canvas(st.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true});const {jsPDF}=window.jspdf;let pdf;
    if(isRoll(size)){const w=size==='r80'?80:58,m=2,iw=w-2*m,ih=canvas.height*iw/canvas.width;pdf=new jsPDF({unit:'mm',format:[w,Math.max(ih+2*m,w+1)],orientation:'portrait'});pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,ih)}
    else{pdf=new jsPDF({unit:'mm',format:size==='a5'?'a5':'a4',orientation:'portrait'});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=10,iw=pw-2*m,ppm=canvas.width/iw,slice=Math.floor((ph-2*m)*ppm);
      for(let y=0;y<canvas.height;y+=slice){const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.min(slice,canvas.height-y);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,-y);if(y)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,c.height/ppm)}}
    pdf.setProperties({title:fname,creator:'Hesabaty - Dev. Ahmed Ismail',subject:meta?'HESABATY:'+b64(meta):''});return pdf.output('blob')}
  catch(e){toast('تعذر عمل PDF: '+(e.message||e),'bad');return null}finally{st.innerHTML=''}}

function numX(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[,٬\s]/g,'').replace(/[^\d.\-]/g,'');return s===''?NaN:parseFloat(s)}
function guessCols(h){const cols={},used=new Set(),order=['code','qty','sale','total','name','price'];
  order.forEach(k=>{const re=FIELDS.find(f=>f[0]===k)[3];const c=h.findIndex((x,i)=>!used.has(i)&&re.test(String(x)));cols[k]=c;if(c>=0)used.add(c)});
  if(cols.name<0&&cols.qty<0&&cols.price<0){cols.name=0;cols.qty=1;cols.price=2}return cols}
function guessHdr(rows){for(let r=0;r<Math.min(rows.length,15);r++){const h=rows[r].map(String);if(FIELDS.filter(f=>h.some(x=>f[3].test(x))).length>=2)return r}return -1}

async function importSheet(inp){const f=inp.files[0];inp.value='';if(!f)return;const ext=f.name.split('.').pop().toLowerCase();toast('جاري قراءة الملف...');

    try{await need('xlsx')}catch(e){return toast('أول مرة تستورد إكسل محتاج إنترنت علشان يحمّل المكتبة','bad')}
    const wb=ext==='csv'?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});mapModal(rows.filter(r=>r.some(c=>String(c).trim()!=='')),f.name)}
  catch(e){toast('تعذر قراءة الملف: '+(e.message||e),'bad')}}
async function readPDF(f){try{await needAll('pdfjs','pdfw')}catch(e){throw new Error('أول مرة تستورد PDF محتاج إنترنت')}
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
  try{const md=await pdf.getMetadata(),sj=md.info&&md.info.Subject||'';if(sj.startsWith('HESABATY:'))return {inv:unb64(sj.slice(9))}}catch(e){}
  const rows=[];for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p),tc=await pg.getTextContent(),lines={};
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/4);(lines[y]=lines[y]||[]).push({x:it.transform[4],w:it.width||0,s:it.str.trim()})});
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{const L=lines[y].sort((a,b)=>b.x-a.x),cells=[];let prev=null;
      L.forEach(t=>{if(prev&&prev.x-(t.x+t.w)<4)cells[cells.length-1]+=' '+t.s;else cells.push(t.s);prev=t});rows.push(cells)})}
  if(!rows.length)throw new Error('الملف ده صورة ممسوحة ضوئياً ومفيهوش نص — استخدم ملف إكسل');return {rows}}
function mapModal(rows,src){if(!rows.length)return toast('الملف فاضي أو مفيهوش جدول','bad');const hdr=guessHdr(rows);
  IMP={rows,src,hdr,cols:guessCols(hdr>=0?rows[hdr]:[]),party:CART&&CART.type==='purchase'?CART.partyId:'',create:true,markup:20};renderMap()}
function parseImp(){const out=[];IMP.rows.slice(IMP.hdr+1).forEach(r=>{const g=k=>IMP.cols[k]>=0?r[IMP.cols[k]]:'';const name=String(g('name')??'').trim();

  let price=numX(g('price'));const tot=numX(g('total'));if(isNaN(price))price=tot>0?r2(tot/qty):0;const sale=numX(g('sale')),code=String(g('code')??'').trim();
  out.push({name,code,qty:r2(qty),price:r2(price),sale:isNaN(sale)?0:r2(sale),match:findProd(code,name)})});return out}

  ${FIELDS.map(([k,l,req])=>`<label class="f">${l}${req?' *':''}<select class="in" id="im_${k}" onchange="IMP.cols['${k}']=+this.value;renderMap()"><option value="-1">—</option>${colOpts.map((t,c)=>`<option value="${c}"${IMP.cols[k]===c?' selected':''}>${esc(t.slice(0,30))}</option>`).join('')}</select></label>`).join('')}
  <label class="f">المورد<select class="in" id="im_s" onchange="IMP.party=this.value"><option value="">مورد نقدي</option>${DB.suppliers.map(x=>`<option value="${x.id}"${x.id===IMP.party?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <label class="f">هامش ربح للأصناف الجديدة %<input class="in" id="im_mk" type="number" step="any" value="${IMP.markup}" oninput="IMP.markup=num(this.value)"></label></div>
  <label class="chk mt-s"><input type="checkbox" id="im_cr" ${IMP.create?'checked':''} onchange="IMP.create=this.checked;renderMap()"> ضيف الأصناف اللي مش موجودة لقائمة الأصناف تلقائياً</label>
  ${L.length?`<div class="tw scroll mt-s"><table><thead><tr><th>الصنف</th><th>الكود</th><th>الكمية</th><th>سعر الشراء</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.name)}</td><td class="m">${esc(l.code||'—')}</td><td class="m">${nfmt(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td><td>${l.match?'<span class="pill ok">موجود</span>':IMP.create?'<span class="pill wa">صنف جديد</span>':'<span class="pill ba">هيتجاهل</span>'}</td></tr>`).join('')}</tbody></table></div>

function applyImport(){const L=parseImp();if(!L.length)return toast('مفيش سطور صالحة','bad');if(!CART||CART.type!=='purchase')newCart('purchase');let add=0,skip=0,made=0;

let BKH=null,AUTO={last:'',err:''};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('hesabaty_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}

async function showSnaps(){const S=(await idbGet('snaps'))||[];
  openModal(`<h2>النسخ التلقائية جوه البرنامج</h2><p class="sub">البرنامج بيحتفظ بآخر 10 نسخ تلقائياً (نسخة كل 10 دقايق شغل). مفيدة لو مسحت حاجة بالغلط.</p>
  ${S.length?`<div class="tw mt-s"><table><thead><tr><th>الوقت</th><th>الفواتير</th><th>الأصناف</th><th></th></tr></thead><tbody>${S.map((x,k)=>`<tr><td>${esc(x.label)}</td><td class="m">${x.inv}</td><td class="m">${x.prod}</td><td><button class="btn sm" onclick="restoreSnap(${k})">استرجاع</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">لسه مفيش نسخ.</p>'}
  <div class="acts mt"><button class="btn" onclick="closeModal()">إغلاق</button></div>`)}
async function restoreSnap(k){const S=(await idbGet('snaps'))||[];if(!S[k])return;try{askRestore(JSON.parse(S[k].data),'نسخة '+S[k].label)}catch(e){toast('النسخة دي تالفة','bad')}}
function askRestore(d,src){if(!d||!d.settings||!Array.isArray(d.products)||!Array.isArray(d.invoices))return toast('ده مش ملف نسخة احتياطية من البرنامج','bad');
  confirmBox('استرجاع '+src+' هيستبدل كل البيانات الحالية.',()=>{DB=d;migrate();save();ME=DB.users.find(u=>u.id===(ME&&ME.id))||null;CART=null;render();toast('اترجعت البيانات','ok')},'استرجاع')}

/* ---------- boot ---------- */
/* ---------- license / remote control ---------- */
const LKEY='hesabaty_lic';
function licOn(){return !!(LIC_CFG.apiKey&&LIC_CFG.projectId)}
function devId(){let id='';try{id=localStorage.getItem('hesabaty_dev')||''}catch(e){}
  if(!id){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';id='';for(let k=0;k<10;k++)id+=a[Math.floor(Math.random()*a.length)];id=id.slice(0,5)+'-'+id.slice(5);try{localStorage.setItem('hesabaty_dev',id)}catch(e){}}return id}
function licGet(){try{return JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){return null}}
function licSet(o){try{localStorage.setItem(LKEY,JSON.stringify(o))}catch(e){}}
const fsv=v=>v==null?{nullValue:null}:typeof v==='number'?(Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v}):typeof v==='boolean'?{booleanValue:v}:v instanceof Date?{timestampValue:v.toISOString()}:typeof v==='object'?{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,fsv(x)]))}}:{stringValue:String(v)};
const fsr=f=>f==null?null:'stringValue' in f?f.stringValue:'integerValue' in f?+f.integerValue:'doubleValue' in f?f.doubleValue:'booleanValue' in f?f.booleanValue:'timestampValue' in f?f.timestampValue:'mapValue' in f?Object.fromEntries(Object.entries(f.mapValue.fields||{}).map(([k,x])=>[k,fsr(x)])):null;
function licUrl(q=''){return `https://firestore.googleapis.com/v1/projects/${LIC_CFG.projectId}/databases/(default)/documents/licenses${q}`}
async function licCheck(){if(!licOn())return licApply();const id=devId(),key='key='+encodeURIComponent(LIC_CFG.apiKey);
  const info={biz:DB.settings.name||'',phone:DB.settings.phone||'',version:APP_VER,lastSeen:new Date(),stats:{invoices:DB.invoices.length,products:DB.products.length,users:DB.users.length}};
  try{let r=await fetch(licUrl('/'+id+'?'+key));let doc;
    if(r.status===404){const exp=new Date(Date.now()+LIC_CFG.trialDays*864e5);
      r=await fetch(licUrl('?documentId='+id+'&'+key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:Object.fromEntries(Object.entries({...info,status:'trial',expires:exp,created:new Date(),msg:''}).map(([k,v])=>[k,fsv(v)]))})});
      if(!r.ok)throw new Error('create '+r.status);doc=await r.json()}
    else{if(!r.ok)throw new Error('get '+r.status);doc=await r.json();
      const mask=Object.keys(info).map(k=>'updateMask.fieldPaths='+k).join('&');
      fetch(licUrl('/'+id+'?'+mask+'&'+key),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:Object.fromEntries(Object.entries(info).map(([k,v])=>[k,fsv(v)]))})}).catch(()=>{})}
    const f=doc.fields||{};licSet({status:fsr(f.status)||'trial',expires:fsr(f.expires),msg:fsr(f.msg)||'',checked:Date.now(),err:''})}
  catch(e){const c=licGet();if(c){c.err='تعذر الاتصال بالسيرفر';licSet(c)}}
  licApply()}
function licState(){if(!licOn())return {mode:'off'};const c=licGet();if(!c)return {mode:'unknown'};
  const left=c.expires?Math.ceil((new Date(c.expires)-Date.now())/864e5):9999;
  if(c.status==='blocked')return {mode:'blocked',c,left};if(left<=0)return {mode:'expired',c,left};return {mode:c.status==='trial'?'trial':'active',c,left}}
function licApply(){const st=licState(),L=$('#lock');
  if(st.mode==='blocked'||st.mode==='expired'){const t=st.mode==='blocked'?'البرنامج موقوف على الجهاز ده':'انتهت مدة الاشتراك';
    const wa=`https://wa.me/${DEV_WA}?text=${encodeURIComponent('عاوز أفعّل برنامج حساباتي — رقم الجهاز: '+devId())}`;
    L.innerHTML=`<div class="lcard">${$('.logo').outerHTML}<h2>${t}</h2><p class="sub">${st.c.msg?esc(st.c.msg):'كلّم المطور علشان يفعّل البرنامج. بياناتك محفوظة ومش هتضيع.'}</p>
     <p class="sub">رقم الجهاز</p><div class="devid">${devId()}</div>
     <div class="acts" style="justify-content:center"><a class="btn pri" href="${wa}" target="_blank" rel="noopener">راسل المطور على واتساب</a><button class="btn" onclick="licCheck().then(()=>toast(licState().mode==='blocked'||licState().mode==='expired'?'لسه مش متفعّل':'اتفعّل البرنامج','ok'))">إعادة المحاولة</button></div>
     <p class="sub">تليفون المطور: <bdi>${DEV_PHONE}</bdi></p><button class="link" onclick="exportData()">حفظ نسخة احتياطية من بياناتي</button>
     <div class="credit" style="width:100%">${$('.credit .cp').outerHTML}<span class="who"><span>مطور البرنامج</span><b>Dev. Ahmed Ismail</b></span></div></div>`;L.hidden=false}
  else{L.hidden=true;L.innerHTML=''}
  if(ME&&(VIEW==='dash'||VIEW==='settings'))render()}
function licBanner(){const st=licState();if(st.mode==='off'||st.mode==='unknown')return '';const c=st.c,out=[];
  if(c.msg){let seen='';try{seen=localStorage.getItem('hesabaty_msgseen')||''}catch(e){}if(seen!==c.msg)out.push(`<div class="banner"><span><b>رسالة من المطور:</b> ${esc(c.msg)}</span><button class="btn sm" onclick="try{localStorage.setItem('hesabaty_msgseen',${esc(JSON.stringify(c.msg))})}catch(e){};render()">تمام</button></div>`)}
  if(st.left<=5)out.push(`<div class="banner"><span>${st.mode==='trial'?'الفترة التجريبية':'الاشتراك'} هيخلص بعد <b>${st.left}</b> يوم. رقم الجهاز <bdi>${devId()}</bdi> — كلّم المطور على <bdi>${DEV_PHONE}</bdi> للتجديد.</span></div>`);
  return out.join('')}
function licSection(){if(!licOn())return '';const st=licState(),c=st.c||{},lab={trial:'<span class="pill wa">تجريبي</span>',active:'<span class="pill ok">مفعّل</span>',blocked:'<span class="pill ba">موقوف</span>',expired:'<span class="pill ba">منتهي</span>',unknown:'<span class="pill nu">لسه ماتأكدش</span>'}[st.mode];
  return `<section class="card mt"><h2>الترخيص والاشتراك</h2><div class="lic"><div><span>رقم الجهاز</span><b class="devid" style="font-size:15px;justify-self:start">${devId()}</b></div><div><span>الحالة</span>${lab}</div>
   <div><span>صالح لحد</span><b class="m">${c.expires?String(c.expires).slice(0,10):'—'}</b></div><div><span>آخر تأكيد</span><b class="m">${c.checked?new Date(c.checked).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'—'}</b></div></div>
   ${c.err?`<p class="sub lowt mt-s">${esc(c.err)} — البرنامج شغال بآخر حالة معروفة.</p>`:''}<div class="acts mt-s"><button class="btn" onclick="licCheck().then(()=>toast('اتحدّثت حالة الترخيص','ok'))">تحديث الحالة</button></div></section>`}

load();
idbGet('bkh').then(hd=>{if(hd){BKH=hd;if(ME)regrant()}});
try{const sid=localStorage.getItem(SKEY);if(sid)ME=DB.users.find(u=>u.id===sid)||null}catch(e){}
if(ME)VIEW=canView('dash')?'dash':'pos';
render();
licApply();licCheck();setInterval(licCheck,6*3600*1000);
</script>
